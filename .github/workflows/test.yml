name: Installed distributions
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Interpreter and SQLite (FTS5 is required)
        shell: bash
        run: |
          python - <<'PY'
          import sqlite3
          import sys
          print(sys.version)
          print("sqlite3 library", sqlite3.sqlite_version)
          connection = sqlite3.connect(":memory:")
          try:
              connection.execute("CREATE VIRTUAL TABLE probe USING fts5(text)")
          except sqlite3.Error as error:
              raise SystemExit("FTS5 is not available in this SQLite build: %s" % error)
          finally:
              connection.close()
          print("FTS5 available")
          PY
      - run: python -m pip install --upgrade build "setuptools>=77" wheel
      - run: python scripts/check_distributions.py
        env:
          PYTHONDONTWRITEBYTECODE: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/
          if-no-files-found: error
