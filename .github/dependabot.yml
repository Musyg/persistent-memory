# Keeps the pinned GitHub Actions and the build requirements current.
# The package itself has no runtime dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directories:
      - /
      - /packages/policy-registry
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
