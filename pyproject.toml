[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-memory"
version = "0.4.0a1"
description = "Persistent memory for AI agents and coding assistants: exact versions, provenance, withdrawal with cascade, MCP server and Hermes Agent provider"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Musyg"}]
dependencies = []
keywords = ["memory", "agents", "mcp", "llm", "provenance", "hermes-agent"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux"]

[project.urls]
Homepage = "https://github.com/Musyg/persistent-memory"
Source = "https://github.com/Musyg/persistent-memory"

[project.scripts]
persistent-memory = "hermes_memory.persistent_cli:main"
hermes-memory = "hermes_memory.cli:main"
hermes-memory-typed = "hermes_memory.typed_admin:main"
hermes-memory-demo = "hermes_memory.demo:main"
persistent-memory-mcp = "hermes_memory.mcp_server:main"

[project.entry-points."hermes_agent.memory_providers"]
persistent-memory = "hermes_memory.hermes_agent:register"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["hermes_memory._admission_sources*"]

[tool.setuptools.package-data]
hermes_memory = ["_admission_sources/*.py", "ADMISSION-PROVENANCE.json"]
