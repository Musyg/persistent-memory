[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "persistent-memory-mcp"
version = "0.4.0a4"
description = "Persistent memory for AI agents and coding assistants: exact versions, provenance, withdrawal with cascade, MCP server and Hermes Agent provider"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Gilles Musy"}]
dependencies = []
keywords = ["memory", "agents", "mcp", "llm", "provenance", "hermes-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
# Search by meaning with a model run in the process; the base install has no dependency.
semantic = ["fastembed>=0.9"]

[project.urls]
Homepage = "https://github.com/Musyg/persistent-memory"
Source = "https://github.com/Musyg/persistent-memory"
Documentation = "https://github.com/Musyg/persistent-memory#readme"
Issues = "https://github.com/Musyg/persistent-memory/issues"
Changelog = "https://github.com/Musyg/persistent-memory/blob/main/CHANGELOG.md"

[project.scripts]
persistent-memory = "hermes_memory.persistent_cli:main"
hermes-memory = "hermes_memory.cli:main"
hermes-memory-typed = "hermes_memory.typed_admin:main"
hermes-memory-demo = "hermes_memory.demo:main"
persistent-memory-mcp = "hermes_memory.mcp_server:main"

[project.entry-points."hermes_agent.memory_providers"]
persistent-memory = "hermes_memory.hermes_agent:register"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hermes_memory*", "persistent_memory*"]

[tool.setuptools.package-data]
hermes_memory = ["_admission_sources/*.py", "ADMISSION-PROVENANCE.json"]
